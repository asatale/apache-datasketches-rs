[package]
name = "apache-datasketches"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe, idiomatic Rust bindings for Apache DataSketches"
readme = "README.md"
keywords = ["datasketches", "hyperloglog", "sketch", "cardinality"]
categories = ["data-structures", "algorithms"]

[features]
# Every sketch family is on by default: an empty default set produced a crate
# that compiled cleanly and exposed nothing, with no diagnostic. The cost is
# C++ compile time (~15s cold, debug, once) -- unused families cost nothing at
# runtime, since the linker drops what you do not call. Opt out with
# `default-features = false` plus the families you want. Note that Cargo
# unifies features across a dependency graph, so opting out only holds if no
# other crate in the graph pulls this one with default features.
default = ["hll", "theta", "cpc", "tuple"]
hll = ["apache-datasketches-sys/hll"]
theta = ["apache-datasketches-sys/theta"]
cpc = ["apache-datasketches-sys/cpc"]
tuple = ["apache-datasketches-sys/tuple"]

[package.metadata.docs.rs]
# Explicit rather than implicit: docs.rs should keep building every family
# even if the default set changes again.
features = ["hll", "theta", "cpc", "tuple"]

[dependencies]
apache-datasketches-sys = { version = "0.2.0", path = "../apache-datasketches-sys", default-features = false }
cxx = "1"
thiserror = "1"

[[example]]
name = "hll"
required-features = ["hll"]

[[example]]
name = "theta"
required-features = ["theta"]

[[example]]
name = "cpc"
required-features = ["cpc"]

[[example]]
name = "tuple"
required-features = ["tuple"]

[[example]]
name = "tuple_generic"
required-features = ["tuple"]

# Perf harness for the ArrayOfDoubles update path, deliberately an example
# rather than a `[[bench]]`: with `harness = false` a bench target is *run* by
# `cargo test`, which would put a multi-million-item loop in CI. As an example
# it is still built and clippy-checked by `--all-targets`, but only ever run
# on request.
[[example]]
name = "bench_tuple_update"
required-features = ["tuple"]

[[example]]
name = "bench_tuple_generic_update"
required-features = ["tuple"]


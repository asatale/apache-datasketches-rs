[package]
name = "apache-datasketches"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe, idiomatic Rust bindings for Apache DataSketches"
readme = "README.md"
keywords = ["datasketches", "hyperloglog", "sketch", "cardinality"]
categories = ["data-structures", "algorithms"]

[features]
default = []
hll = ["apache-datasketches-sys/hll"]
theta = ["apache-datasketches-sys/theta"]
cpc = ["apache-datasketches-sys/cpc"]
tuple = ["apache-datasketches-sys/tuple"]

[package.metadata.docs.rs]
# default = [] means docs.rs's default build would show an empty crate;
# build with every sketch family enabled instead.
features = ["hll", "theta", "cpc", "tuple"]

[dependencies]
apache-datasketches-sys = { version = "0.2.0", path = "../apache-datasketches-sys", default-features = false }
cxx = "1"
thiserror = "1"

[[example]]
name = "hll"
required-features = ["hll"]

[[example]]
name = "theta"
required-features = ["theta"]

[[example]]
name = "cpc"
required-features = ["cpc"]


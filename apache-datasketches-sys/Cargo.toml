[package]
name = "apache-datasketches-sys"
version = "0.2.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw cxx bridge to Apache DataSketches C++ (do not use directly; see apache-datasketches)"
readme = "README.md"
keywords = ["datasketches", "hyperloglog", "sketch", "ffi"]
categories = ["external-ffi-bindings"]
links = "datasketches"

[lib]
name = "apache_datasketches_sys"
path = "src/lib.rs"

[features]
default = []
hll = []
theta = []
cpc = []
tuple = []

[dependencies]
cxx = "1"

[build-dependencies]
cxx-build = "1"

[[test]]
name = "vendor_drift_test"
# Deliberately no required-features: this compares header trees on disk and
# must run in every configuration, including the default no-feature build.

[[test]]
name = "hll_sketch_link_test"
required-features = ["hll"]

[[test]]
name = "theta_sketch_link_test"
required-features = ["theta"]

[[test]]
name = "theta_compact_link_test"
required-features = ["theta"]

[[test]]
name = "theta_wrapped_link_test"
required-features = ["theta"]

[[test]]
name = "theta_union_link_test"
required-features = ["theta"]

[[test]]
name = "theta_intersection_link_test"
required-features = ["theta"]

[[test]]
name = "theta_a_not_b_link_test"
required-features = ["theta"]

[[test]]
name = "theta_jaccard_link_test"
required-features = ["theta"]

[[test]]
name = "cpc_sketch_link_test"
required-features = ["cpc"]

[[test]]
name = "cpc_union_link_test"
required-features = ["cpc"]

[[test]]
name = "array_of_doubles_sketch_link_test"
required-features = ["tuple"]

[[test]]
name = "array_of_doubles_compact_link_test"
required-features = ["tuple"]

[[test]]
name = "array_of_doubles_union_link_test"
required-features = ["tuple"]

[[test]]
name = "array_of_doubles_intersection_link_test"
required-features = ["tuple"]

[[test]]
name = "array_of_doubles_a_not_b_link_test"
